# autoshorts configuration
# ------------------------
# Copy this file to config.yaml (`autoshorts init` does it for you) and edit what you need.
# Every setting below shows its built-in default; delete a line to fall back to it.
# Relative paths are relative to the folder that contains config.yaml.
#
# Secrets (API keys, tokens) NEVER go in this file. Settings ending in `_env` only name
# the environment variable that holds the secret; put the value itself in `.env`.

output_dir: output            # one folder per video: output/<YYYYMMDD-HHMMSS>-<slug>/
log_level: INFO               # DEBUG | INFO | WARNING | ERROR  (`-v` on the command line = DEBUG)
keep_intermediate: false      # true keeps <job>/work/ (per-segment audio, shots) for debugging

# --------------------------------------------------------------------------- video
video:
  width: 1080                 # 1080x1920 = 9:16 vertical, what TikTok and Shorts expect
  height: 1920
  fps: 30
  # Length the script writer aims for. TikTok's Creator Rewards Program only pays for
  # videos longer than 1 minute; YouTube treats vertical videos up to 3 minutes as Shorts.
  target_seconds: 65
  max_seconds: 175            # hard cap; longer narrations are shortened automatically
  crf: 20                     # x264 quality: lower = better and bigger (18-23 is sensible)
  preset: medium              # x264 speed: ultrafast ... veryslow; "veryfast" on slow machines/VPS
  audio_bitrate: 192k         # AAC bitrate of the final video

# --------------------------------------------------------------------------- script writer
script:
  # auto: Ollama (if running and the model is pulled) -> openai_compatible (if the API
  #       key is set) -> offline. If the LLM fails mid-batch, the next one is used.
  # ollama | openai_compatible | offline: use exactly that one (no silent fallback).
  provider: auto
  # facts | story | quiz | motivation | explainer | random (a different one each video)
  format: random
  language: en                # language the script is written in; pick a matching tts voice
  temperature: 0.9            # LLM creativity (0.0 - 1.5)
  timeout: 180                # seconds to wait for one LLM reply

  # Local, free, private: install https://ollama.com and run `ollama pull llama3.1:8b`.
  ollama:
    base_url: http://localhost:11434
    model: llama3.1:8b

  # Any OpenAI-compatible chat API with a free tier. Put the key in .env (LLM_API_KEY).
  #   Groq:          base_url https://api.groq.com/openai/v1
  #                  model    openai/gpt-oss-120b              (key: https://console.groq.com/keys)
  #   Google Gemini: base_url https://generativelanguage.googleapis.com/v1beta/openai
  #                  model    a current Flash model from https://ai.google.dev/gemini-api/docs/models
  #                           (gemini-2.0-flash was shut down in June 2026)
  #                                                            (key: https://aistudio.google.com/apikey)
  #   OpenRouter:    base_url https://openrouter.ai/api/v1
  #                  model    any model id ending in ":free"   (key: https://openrouter.ai/keys)
  openai_compatible:
    base_url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b
    api_key_env: LLM_API_KEY  # name of the env var holding the key (value goes in .env)

# --------------------------------------------------------------------------- voice-over
tts:
  # auto: edge (online neural voices) -> pyttsx3 (Windows/macOS) -> espeak (offline).
  # edge | pyttsx3 | espeak: use exactly that engine.
  provider: auto
  segment_gap: 0.15           # seconds of silence between script segments

  # Free Microsoft Edge neural voices (needs internet). List them: `autoshorts voices --lang en`
  edge:
    voice: en-US-AndrewNeural # e.g. en-US-AriaNeural, en-US-GuyNeural, en-GB-RyanNeural
    rate: "+5%"               # speaking speed, e.g. "-10%", "+15%"
    pitch: "+0Hz"             # e.g. "-5Hz", "+10Hz"
    volume: "+0%"

  # espeak-ng: offline and robotic, but always works (Linux: apt install espeak-ng).
  espeak:
    voice: en-us              # `espeak-ng --voices` lists them
    speed: 150                # words per minute

  # pyttsx3: offline system voices (SAPI5 on Windows, NSSpeech on macOS).
  pyttsx3:
    rate: 185                 # words per minute
    voice: null               # part of a voice name/id, e.g. "Zira"; null = system default

# --------------------------------------------------------------------------- background footage
visuals:
  # Tried in this order for each script segment. "generated" (abstract animated
  # backgrounds made by FFmpeg) never fails, so keep it last.
  providers: [pexels, pixabay, local, generated]
  pexels_api_key_env: PEXELS_API_KEY    # free key: https://www.pexels.com/api/
  pixabay_api_key_env: PIXABAY_API_KEY  # free key: https://pixabay.com/api/docs/
  local_dir: assets/backgrounds         # your own clips/images (.mp4 .mov .mkv .webm .m4v .jpg .png .webp)
  cache_dir: cache/clips                # downloaded and generated clips are reused from here
  max_shot_seconds: 4.0                 # long segments are split into several shots
  timeout: 60                           # seconds per stock-site request/download

# --------------------------------------------------------------------------- captions
captions:
  font: auto                  # a font family name, or auto (a bold system font)
  fonts_dir: assets/fonts     # drop .ttf/.otf files here to use them (e.g. Montserrat ExtraBold)
  font_size: 88               # at 1080x1920; shrinks automatically if a line does not fit
  words_per_caption: 3        # max words on screen at once
  max_chars: 20               # max characters per caption
  uppercase: true
  primary_color: "#FFFFFF"    # text colour
  highlight_color: "#FFE135"  # the word being spoken right now
  outline_color: "#000000"
  outline: 6                  # outline thickness (px)
  shadow: 3                   # shadow distance (px)
  position: 0.68              # vertical centre of the captions, 0 = top, 1 = bottom
  pop: true                   # small scale-in animation for each new caption
  show_title: true            # show the hook/title banner at the top...
  title_seconds: 3.0          # ...for this many seconds

# --------------------------------------------------------------------------- background music
music:
  enabled: true
  dir: assets/music           # a random track from here (.mp3 .m4a .aac .wav .ogg .flac); empty = voice only
  volume: 0.12                # relative to the narration
  duck: true                  # lower the music further while the voice is speaking

# --------------------------------------------------------------------------- titles & hashtags
metadata:
  extra_hashtags: [shorts]    # added to every video ("#shorts" is only used on YouTube)
  max_hashtags: 8
  ai_disclosure: true         # adds "Narration voiced with text-to-speech; script assisted by AI."

# --------------------------------------------------------------------------- uploads
# `make` and `batch` upload to every platform with `enabled: true` unless you pass
# --no-upload; `--upload youtube,tiktok` picks platforms for one run.
upload:
  youtube:
    enabled: false
    client_secrets: secrets/client_secret.json  # OAuth "Desktop app" client from Google Cloud
    token_file: secrets/youtube_token.json      # written by `autoshorts auth youtube`
    privacy: private          # private | unlisted | public. Keep private and review each video first.
                              # (Unaudited Google API projects can only upload private videos anyway.)
    category_id: "27"         # 27 = Education, 24 = Entertainment, 22 = People & Blogs
    made_for_kids: false
    contains_synthetic_media: true  # YouTube's "altered or synthetic content" disclosure

  tiktok:
    enabled: false
    access_token_env: TIKTOK_ACCESS_TOKEN  # env var with the user access token (value in .env)
    # inbox:  the video arrives in the TikTok app as a draft; you add the caption from
    #         tiktok.txt and post it yourself. Works for any developer app, no audit.
    # direct: posts straight away; private only (SELF_ONLY) until TikTok audits your app.
    mode: inbox
    privacy_level: SELF_ONLY  # direct mode: SELF_ONLY | MUTUAL_FOLLOW_FRIENDS | FOLLOWER_OF_CREATOR | PUBLIC_TO_EVERYONE
    is_aigc: true             # direct mode: mark the post as AI-generated content

  # script.provider auto falls back to the 33-script offline bank when no LLM is available
  # (or it fails). Those videos are rendered but not uploaded unless this is true.
  upload_offline_fallback: false

# --------------------------------------------------------------------------- topics
topics:
  file: topics.txt            # one topic per line, '#' comments allowed
  state_file: state/used_topics.json  # remembers which topics already became videos
  allow_repeats: false        # true: reuse the oldest topics when everything is used

# --------------------------------------------------------------------------- housekeeping
# Runs before every video so an unattended server never fills its disk.
retention:
  cache_max_mb: 5000          # cache/clips (stock downloads, generated backgrounds), least recently used go first
  output_keep_days: 0         # >0: delete video.mp4/thumbnail.jpg of jobs older than this (job.json etc. stay); 0 keeps all
