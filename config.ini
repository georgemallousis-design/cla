# Warehouse Management System - Configuration File
# Edit these settings to customize application behavior

[Application]
name = Warehouse Management System
version = 1.0.0
author = MallousG
debug_mode = False

[Database]
# Database file location
filename = data/warehouse.db
# Automatic backup settings
auto_backup = True
backup_interval_hours = 24
max_backup_files = 7
backup_directory = backups/

[UI]
# User interface settings
theme = dark
default_view = grid
auto_refresh = True
refresh_interval_seconds = 300
window_state = maximized
remember_window_size = True

[Security]
# Security and session settings
session_timeout_minutes = 60
max_login_attempts = 5
password_min_length = 4
auto_logout_warning = True
require_password_change = False

[Logging]
# Logging configuration
log_level = INFO
log_directory = logs/
max_log_file_size_mb = 10
max_log_files = 5
log_to_console = True

[Export]
# Export/Import settings
default_export_directory = exports/
csv_delimiter = ,
csv_encoding = utf-8
excel_format = xlsx
include_images_in_export = True

[Images]
# Image handling settings
image_directory = images/
thumbnail_size = 64
max_image_size_mb = 5
allowed_formats = jpg,jpeg,png,bmp,gif
auto_resize = True

[Performance]
# Performance optimization
cache_thumbnails = True
max_cache_size_mb = 100
lazy_load_images = True
batch_size = 100

[Features]
# Feature toggles
enable_fuzzy_search = True
enable_drag_select = True
enable_comparison = True
enable_audit_trail = True
enable_notifications = True

[Notifications]
# Notification settings
warranty_expiry_days = 30
low_stock_threshold = 5
show_tooltips = True
notification_sound = False

[Backup]
# Backup configuration
compress_backups = True
encrypt_backups = False
cloud_backup = False
cloud_provider = none

[Advanced]
# Advanced settings (modify with caution)
sqlite_cache_size = 10000
sqlite_journal_mode = WAL
sqlite_synchronous = NORMAL
connection_timeout = 30

# Custom SQL queries for reports (advanced users only)
[CustomQueries]
# Example: monthly_sales = SELECT * FROM materials WHERE created_date >= date('now', '-1 month')

[Maintenance]
# Database maintenance settings
auto_vacuum = True
auto_analyze = True
maintenance_hour = 2
optimize_on_startup = False

# Regional settings
[Locale]
language = en
date_format = YYYY-MM-DD
time_format = 24h
currency_symbol = €
decimal_separator = .
thousands_separator = ,